<!DOCTYPE html>
<html lang="fr-FR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conseil National de Sécurité - Présidence de la République</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/public/css/bootstrap.css">
    <link rel="stylesheet" href="/public/vendors/bootstrap-icons/bootstrap-icons.css">
    <link rel="stylesheet" href="/public/css/app.css">
    <link rel="stylesheet" href="/public/css/override.css">
    <link rel="stylesheet" href="/public/css/pages/auth.css">
</head>

<body data-route-page="index.html">
    <div id="auth">

        <div class="row h-100">
            <div class="col-lg-7 d-none d-lg-block">
                <div id="auth-right">
                    
                    <div class="login-left-wrapper">
                        <div class="login-logo div-img">
                            <img src="/public/images/logo/logo-final.png" alt="no image">
                        </div>
                        <div class="login-left-text">
                            <h1 class="">Présidence de la République</h1>
                            <h5 class="styled-font">Conseil National de Sécurité</h5>
                        </div>
                    </div>
                    <footer class="login-footer">
                        <div class="copyright content-font">
                            2026 © Conseil National de Sécurité - Tous droits réservés
                        </div>

                        <div class="flag-bars">
                            <div class="bar bar-blue"></div>
                            <div class="bar bar-yellow"></div>
                            <div class="bar bar-red"></div>
                        </div>
                    </footer>

                </div>
            </div>
            <div class="col-lg-5 col-12">
                <div id="auth-left">
                    <div class="auth-logo"></div>
                    <h1 class="auth-title text-center">Connexion</h1>
                    <p class="text-muted small mb-5 auth-subtitle text-center">Connectez-vous avec votre numéro de tél et votre mot de passe.</p>

                    <form id="login-form" novalidate method="post" action="javascript:void(0);">
                        <div class="form-group position-relative has-icon-left mb-4">
                            <input id="login-email" type="email" class="form-control form-control-xl" placeholder="Email" required autocomplete="email">
                            <div class="form-control-icon">
                                <i class="bi bi-envelope"></i>
                            </div>
                        </div>
                        <div class="form-group position-relative has-icon-left mb-4">
                            <input id="login-password" type="password" class="form-control form-control-xl" placeholder="Mot de passe" required autocomplete="current-password">
                            <div class="form-control-icon">
                                <i class="bi bi-shield-lock"></i>
                            </div>
                        </div>
                        <div class="form-check form-check-lg d-flex align-items-end">
                            <input class="form-check-input me-2" type="checkbox" value="" id="flexCheckDefault">
                            <label class="form-check-label text-gray-600" for="flexCheckDefault">
                                Rester connecté
                            </label>
                        </div>
                        <div id="login-error" class="alert alert-danger d-none mt-4" role="alert"></div>
                        <button type="submit" class="btn btn-primary btn-block btn-lg shadow-lg mt-5">Se connecter</button>
                    </form>
                </div>
            </div>
        </div>

    </div>
    <script src="/public/js/session-user.js"></script>
    <script src="/public/js/login.js" defer></script>
    <script src="/public/js/router.js" defer></script>
</body>
</html>
